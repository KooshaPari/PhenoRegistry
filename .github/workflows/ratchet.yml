# Q2 quality ratchet (coverage gate). Source: FLEET-AUDIT-REPORT.md, Q2.
name: Quality Ratchet

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  coverage-ratchet:
    name: Coverage ratchet
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.0

      - name: Check coverage report
        id: report
        run: |
          if [ -f coverage/coverage-summary.json ]; then
            echo "present=true" >> "${GITHUB_OUTPUT}"
          else
            echo "present=false" >> "${GITHUB_OUTPUT}"
            echo "::warning title=coverage ratchet skipped::No coverage/coverage-summary.json report exists in this repository, so there is no coverage measurement to compare against the baseline."
          fi

      - name: Read baseline
        id: prev
        if: steps.report.outputs.present == 'true'
        run: |
          if [ -f .coverage-baseline ] && grep -Eq '^[0-9]+([.][0-9]+)?$' .coverage-baseline; then
            echo "prev=$(cat .coverage-baseline)" >> "${GITHUB_OUTPUT}"
          else
            echo "prev=0" >> "${GITHUB_OUTPUT}"
          fi

      - name: Read current coverage
        id: curr
        if: steps.report.outputs.present == 'true'
        run: |
          CURR=$(jq -r '.total.lines.pct' coverage/coverage-summary.json)
          echo "curr=${CURR}" >> "${GITHUB_OUTPUT}"
          echo "Current line coverage: ${CURR}"

      - name: Assert coverage ratchet
        if: steps.report.outputs.present == 'true'
        run: |
          PREV="${{ steps.prev.outputs.prev }}"
          CURR="${{ steps.curr.outputs.curr }}"
          if [ -z "${CURR}" ] || [ "${CURR}" = "null" ]; then
            echo "::error::coverage/coverage-summary.json does not contain total.lines.pct"
            exit 1
          fi
          REGRESSED=$(awk -v curr="${CURR}" -v prev="${PREV}" 'BEGIN { if (curr + 0 < prev + 0) print 1; else print 0 }')
          if [ "${REGRESSED}" = "1" ]; then
            echo "::error::Line coverage regressed from ${PREV} to ${CURR}"
            exit 1
          fi
          echo "Line coverage ratchet: ${PREV} -> ${CURR}, no regression"

      - name: Update baseline on main
        if: github.event_name == 'push' && github.ref == 'refs/heads/main' && steps.report.outputs.present == 'true'
        run: |
          CURR="${{ steps.curr.outputs.curr }}"
          if [ -f .coverage-baseline ] && [ "$(cat .coverage-baseline)" = "${CURR}" ]; then
            echo "Baseline already at ${CURR}"
            exit 0
          fi
          printf '%s' "${CURR}" > .coverage-baseline
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add .coverage-baseline
          git commit -m "chore(ci): raise coverage baseline to ${CURR}"
          git push
