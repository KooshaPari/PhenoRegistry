name: cargo-deny

on:
  # push/PR disabled so this stays a weekly gate rather than a per-commit one.
  # The check runs at the repository root, which is the Rust workspace that
  # carries deny.toml and a Cargo.lock resolvable against crates.io.
  # Two defects cleared here on 2026-10-02, both reproduced locally:
  #   1. `cargo deny check --all-features` -- cargo-deny 0.20.2 moved
  #      --all-features to the top level, so the old order exited 2 with
  #      "unexpected argument '--all-features' found" (run 36409415048).
  #   2. working-directory pointed at audits/org-audits/2026-04-24/aggregator,
  #      whose Cargo.lock checksums disagree with crates.io for every package
  #      sampled, so `cargo metadata` exited 101 before any check ran. The
  #      root lock matched crates.io on 10 of 10 sampled packages.
  schedule:
    - cron: "0 4 * * 1" # Weekly Monday 4am UTC
  workflow_dispatch:

permissions:
  contents: read

jobs:
  deny:
    name: cargo-deny
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@6bed0761d98439e5a578e2877258200ad565ba87 # stable
        with:
          components: rustfmt, clippy

      - name: Cache cargo registry
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: ${{ runner.os }}-cargo-deny-${{ hashFiles('Cargo.lock') }}
          restore-keys: |
            ${{ runner.os }}-cargo-deny-

      - name: Install cargo-deny
        uses: taiki-e/install-action@83ac0ad63c0167e6f06796fab0fce28db1bf3db0 # v2
        with:
          tool: cargo-deny

      - name: Run cargo-deny check (block-release)
        run: cargo deny --all-features check

      - name: Run cargo-deny advisories (log-only on PRs)
        if: ${{ github.event_name == 'pull_request' }}
        # Grouped redirect + quoted target keep shellcheck SC2086/SC2129 quiet.
        run: |
          cargo deny --all-features check advisories 2>&1 | tee deny-advisories.txt || true
          if [ -s deny-advisories.txt ]; then
            {
              echo "## cargo-deny advisories"
              echo '```'
              cat deny-advisories.txt
              echo '```'
            } >> "$GITHUB_STEP_SUMMARY"
          fi
