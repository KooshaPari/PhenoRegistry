name: cargo-deny

on:
  # push/PR disabled — this repo only has markdown files
  # cargo-deny requires Rust workspace which doesn't exist here
  schedule:
    - cron: '0 4 * * 1'  # Weekly Monday 4am UTC
  workflow_dispatch:

permissions:
  contents: read

jobs:
  deny:
    name: cargo-deny
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        # actions/checkout@v4 -> 11d5960a326750d5838078e36cf38b85af677262 (refs/tags/v4, peeled)
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - name: Install Rust toolchain
        # dtolnay/rust-toolchain@stable -> 6bed0761d98439e5a578e2877258200ad565ba87 (refs/heads/stable, mutable branch)
        uses: dtolnay/rust-toolchain@6bed0761d98439e5a578e2877258200ad565ba87 # stable (mutable branch HEAD)
        with:
          components: rustfmt, clippy

      - name: Cache cargo registry
        # actions/cache@v4 -> 0057852bfaa89a56745cba8c7296529d2fc39830 (refs/tags/v4, peeled)
        uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: ${{ runner.os }}-cargo-deny-${{ hashFiles('audits/org-audits/2026-04-24/aggregator/Cargo.lock') }}
          restore-keys: |
            ${{ runner.os }}-cargo-deny-

      - name: Install cargo-deny
        # taiki-e/install-action@v2 -> 3f74d7c16a4242f1c95561e98edc25d36adb4375 (refs/tags/v2, peeled)
        uses: taiki-e/install-action@3f74d7c16a4242f1c95561e98edc25d36adb4375 # v2
        with:
            tool: cargo-deny

      - name: Run cargo-deny check (block-release)
        working-directory: audits/org-audits/2026-04-24/aggregator
        run: cargo deny check --all-features

      - name: Run cargo-deny advisories (log-only on PRs)
        if: github.event_name == 'pull_request'
        working-directory: audits/org-audits/2026-04-24/aggregator
        run: |
          cargo deny check advisories --all-features 2>&1 | tee deny-advisories.txt || true
          if [ -s deny-advisories.txt ]; then
            echo "## cargo-deny advisories" >> $GITHUB_STEP_SUMMARY
            echo '```' >> $GITHUB_STEP_SUMMARY
            cat deny-advisories.txt >> $GITHUB_STEP_SUMMARY
            echo '```' >> $GITHUB_STEP_SUMMARY
          fi
