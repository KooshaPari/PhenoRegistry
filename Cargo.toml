[workspace]
resolver = "3"
members = [
    "crates/phenotype-dag-core",
    "crates/pheno-registry-python",
]

[package]
name = "phenotype-registry"
version = "1.1.0"
edition = "2021"

[lib]
name = "phenotype_registry"
path = "src/lib.rs"

[dev-dependencies]
criterion = "0.8"
proptest = "1"

[[bench]]
name = "criterion_bench"
harness = false
